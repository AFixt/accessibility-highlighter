name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  # Quick scan on every push/PR
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Gating: only production dependencies ship to users. See ci.yml for the
      # rationale — this is the one audit result that warrants failing a build.
      - name: Run npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Non-gating: dev-toolchain advisories are reported, not enforced.
      - name: Run npm audit (all dependencies, report only)
        if: always()
        run: |
          npm audit --audit-level=high > audit.txt 2>&1 && status=0 || status=$?
          {
            echo "### npm audit (dev + production)"
            echo
            if [ "$status" -eq 0 ]; then
              echo "No advisories at high or above."
            else
              echo "Advisories found (dev-only unless the production step failed)."
              echo
              echo '```'
              cat audit.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt

      - name: Run npm audit (JSON output)
        if: always()
        run: npm audit --json > npm-audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

  # Dev-dependency advisories are deliberately non-gating, which means nothing
  # about them reaches a human on a normal PR. This manually-triggered job is
  # the mechanism that surfaces them: it opens (or refreshes) a single tracking
  # issue so the backlog stays visible, and closes it once the tree is clean.
  audit-report:
    name: Report audit findings
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect audit summary
        id: audit
        run: |
          npm audit --json > audit.json 2>/dev/null || true
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const m = a.metadata.vulnerabilities;
            const total = m.critical + m.high + m.moderate + m.low;
            const lines = [];
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              const fix = v.fixAvailable === false
                ? 'no fix available'
                : v.fixAvailable === true
                  ? 'non-breaking fix'
                  : \`requires \${v.fixAvailable.name}@\${v.fixAvailable.version} (major)\`;
              lines.push(\`| \${name} | \${v.severity} | \${fix} |\`);
            }
            const body = [
              \`\\\`npm audit\\\` found **\${total}** advisories \` +
                \`(\${m.critical} critical, \${m.high} high, \${m.moderate} moderate, \${m.low} low).\`,
              '',
              'This extension ships **zero production dependencies**, so these are',
              'dev-toolchain only and do not affect published builds. They are tracked',
              'here because the PR-time audit steps are intentionally non-gating for',
              'dev dependencies.',
              '',
              '| Package | Severity | Fix |',
              '| --- | --- | --- |',
              ...lines,
              '',
              \`Run: \${process.env.RUN_URL}\`,
            ].join('\n');
            fs.writeFileSync('audit-body.md', body);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`total=\${total}\n\`);
          "
          cat audit-body.md >> "$GITHUB_STEP_SUMMARY"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Open or update tracking issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        # Pass the count through the environment rather than interpolating
        # ${{ }} into the script body: expression interpolation is substituted
        # as raw text before the script is parsed, so it is the standard
        # script-injection vector even when the current source is trusted.
        env:
          AUDIT_TOTAL: ${{ steps.audit.outputs.total }}
        with:
          script: |
            const fs = require('fs');
            const total = Number(process.env.AUDIT_TOTAL);
            const title = 'chore(security): npm audit findings (dev dependencies)';
            // Look the issue up by label rather than via the search API: search
            // is eventually consistent, so a freshly opened issue can be missed
            // and duplicated on the next run.
            const found = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'npm-audit',
              per_page: 100,
            });
            const existing = found.find((i) => i.title === title && !i.pull_request);

            if (total === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: existing.number,
                  body: 'npm audit is now clean. Closing.',
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = fs.readFileSync('audit-body.md', 'utf8');
            if (existing) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['security', 'dependencies', 'npm-audit'],
              });
            }

  # Secret scanning (every push/PR) — installs gitleaks binary directly to
  # avoid the gitleaks-action org-licensing dependency.
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail

          # On CI always fetch the pinned build so the scan is reproducible.
          # Off CI, reuse whatever is already installed: this step must never
          # overwrite a developer's own binary, which is what hardcoding
          # linux_x64 into /usr/local/bin used to do when the workflow was
          # reproduced locally on macOS.
          # Probe by running it, not with `command -v`: that only checks for an
          # executable bit, so a binary for the wrong architecture — the exact
          # mess this step used to create — would be "reused" and then fail in
          # the next step. Failing the probe falls through to the download and
          # self-heals.
          if [ -z "${GITHUB_ACTIONS:-}" ] && installed=$(gitleaks version 2>/dev/null); then
            echo "Not on CI; reusing installed gitleaks ${installed} (CI pins ${GITLEAKS_VERSION})"
            exit 0
          fi

          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          # gitleaks spells x86_64 as "x64" in its release asset names.
          case "$(uname -m)" in
            x86_64 | amd64) arch=x64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          bindir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ci-tools"
          mkdir -p "$bindir"
          # -f so an HTTP error fails here instead of piping an error page to tar.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz" \
            | tar -xz -C "$bindir" gitleaks
          "$bindir/gitleaks" version

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$bindir" >> "$GITHUB_PATH"
          else
            echo "Installed to $bindir; add it to PATH to run gitleaks."
          fi

      # Gates. A secret reaches the history through a pull request, so this is
      # the moment it is cheap to stop; after the merge it is a rotation, not a
      # fix. Was continue-on-error until #112, which meant a PR committing a
      # secret got a green "Gitleaks (secrets)" tick.
      - name: Run gitleaks
        run: gitleaks detect --no-banner --redact --verbose

  # OSV-Scanner — Google vulnerability scanner (every push/PR)
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Gates. This is the only check in the pipeline that sees a *dev*
      # dependency advisory: both npm audit gates run --omit=dev, and the
      # all-dependency audits are report-only. With nothing watching between
      # pushes (no Dependabot, no scheduled jobs), a non-gating OSV meant a
      # vulnerable dev dependency had no way at all to fail a build. Two High
      # browserslist advisories sat here green through #108 for exactly that
      # reason. Was continue-on-error until #112.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b00f71e051ddddc6e46a193c31c8c0bf283bf9e6 # v2.1.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --recursive
            .

  # OWASP Dependency-Check: a GATE at CVSS >= 7 (#148).
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # CLAUDE.md requires OWASP Dependency-Check to run on pull_request: a
    # dependency vulnerability enters the tree via a PR, so that is where it
    # must be caught. Manual dispatch stays available for ad-hoc runs.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The scanner image is pinned by DIGEST and run directly (#148),
      # replacing the Dependency-Check_Action wrapper. The wrapper's Dockerfile
      # is `FROM owasp/dependency-check-action:latest`, so pinning its commit
      # pinned the wrapper and never the scanner or its CVE data, which were
      # rebuilt daily under the job without review. Same shape as the
      # AFixt/detect-features reference (#87, #89, #99, #101).
      #
      # Freshness: --noupdate scans against the CVE data baked into the image,
      # so no NVD download or API key is needed, and findings are only as
      # fresh as the pinned build. Nothing bumps the digest automatically (no
      # Dependabot, no scheduled jobs), so the step prints the build date and
      # warns once it is over DC_MAX_AGE_DAYS old. To bump: take the current
      # `latest` digest (`docker buildx imagetools inspect
      # owasp/dependency-check-action:latest`), then verify locally that this
      # repo still exits 0 and a known-vulnerable lockfile exits 15.
      #
      # Gate: --failOnCVSS 7 exits 15 on any finding at CVSS >= 7. Without it
      # the scanner exits 0 whatever it finds. Reviewed false positives go in
      # .dependency-check-suppressions.xml, each with a reason and an `until`
      # date. A real vulnerability gets fixed, not suppressed.
      #
      # Exit codes other than 0 and 15: when any analyzer throws, the CLI
      # exits 14 WITHOUT evaluating --failOnCVSS, so 14 means the gate did not
      # run and can hide a real finding. Any exit other than 0 or 15 is retried
      # once (analyzer errors are usually transient: the npm audit API, a
      # loaded runner); 15 is never retried; a second non-0/non-15 exit fails
      # the job with an explicit error. It never passes.
      #
      # Flags that must not come back: --nodeAuditAnalyzer does not exist (the
      # Node Audit Analyzer is on unless --disableNodeAudit), and
      # --nodePackageSkipDevDependencies is a bare switch that *skips* dev
      # dependencies, which would make this job scan nothing, since the
      # extension ships zero production dependencies. --enableExperimental is
      # dropped: its extra analyzers cover ecosystems this repo does not have,
      # and each one is another way for an analyzer to throw (exit 14).
      #
      # The Yarn and pnpm audit analyzers are disabled: this is an npm project
      # with neither lockfile, so they can find nothing.
      #
      # --out must already exist: the scanner exits 1 when the parent of the
      # --out path is missing, hence the mkdir.
      - name: OWASP Dependency-Check
        env:
          DC_IMAGE: owasp/dependency-check-action@sha256:1782f0b306f3e73e98e7c1f00f3fd8ae4a6214deaceebffa38ecb821874bbfcd # built 2026-09-25, dependency-check 13.0.0
          DC_MAX_AGE_DAYS: '30'
          PROJECT: ${{ github.event.repository.name }}
        run: |
          docker pull --quiet "$DC_IMAGE"
          built=$(docker image inspect --format '{{.Created}}' "$DC_IMAGE")
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          echo "Scanner image built ${built} (age: ${age_days} day(s))"
          {
            echo "### OWASP Dependency-Check"
            echo "CVE data from image built ${built}: **${age_days} day(s) old**."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$age_days" -gt "$DC_MAX_AGE_DAYS" ]; then
            echo "::warning title=Dependency-Check data is ${age_days} day(s) old::The pinned scanner image is older than ${DC_MAX_AGE_DAYS} days, so CVEs published since then are not checked. Bump DC_IMAGE in security.yml (see the comment above it)."
          fi
          mkdir -p reports
          scan() {
            docker run --rm -v "$PWD":/src -w /src "$DC_IMAGE" \
              --project "$PROJECT" \
              --scan /src \
              --format HTML \
              --format JSON \
              --format SARIF \
              --out /src/reports \
              --noupdate \
              --suppression /src/.dependency-check-suppressions.xml \
              --failOnCVSS 7 \
              --enableRetired \
              --disableYarnAudit \
              --disablePnpmAudit
          }
          rc=0
          scan || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 15 ]; then
            echo "::warning title=Dependency-Check did not complete (exit ${rc})::The scan did not complete, so the CVSS check did not run. Retrying once."
            sleep 30
            rc=0
            scan || rc=$?
          fi
          case "$rc" in
            0) ;;
            15) echo "::error title=Dependency-Check found CVSS >= 7::See the owasp-dependency-check-report artifact." ;;
            *) echo "::error title=Dependency-Check did not complete (exit ${rc}), twice::The CVSS check did not run, so a real finding may be hidden. This is not a pass. See the [ERROR] lines above, then re-run the job." ;;
          esac
          exit "$rc"

      # always(): the report matters most when the gate has just failed.
      - name: Upload OWASP results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 90

      # hashFiles(): after a scan that never completed there is no SARIF, and
      # an upload of a missing file would add a second, misleading failure.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: reports/dependency-check-report.sarif
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''

  # License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    # Content/compliance checks run on pull_request per CLAUDE.md; a
    # non-allowlisted licence arrives with the PR that adds the dependency.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Use the repo's own license-checker-rseidelsohn (a devDependency, so it
      # is already installed) rather than globally installing the unmaintained
      # `license-checker`. They are different tools and did not have to agree,
      # which meant CI was gating on something the local `npm run license:check`
      # never evaluated.
      - name: Generate license report
        run: |
          npx license-checker-rseidelsohn --json --out licenses.json
          npx license-checker-rseidelsohn --summary

      # Two gates, because the two trees warrant different strictness.
      #
      # Production is an allowlist — anything that could ship has to be on a
      # short known-good list. Note what it covers today: `dependencies` is {}
      # and the build is a `cp` of src/, so this currently gates on the repo's
      # own package and nothing else. It is here for the moment a runtime
      # dependency appears, not because it is doing work now. On its own it
      # would be a check that cannot fail, which is the whole complaint in
      # #112 — hence the second gate below.
      - name: Check production licences against the allowlist
        run: npm run license:check

      # The dev tree is ~830 packages, so a denylist of the categories that
      # would actually be a problem, rather than an allowlist nobody keeps
      # current. This is the gate that covers real third-party code today.
      #
      # Every identifier is spelled out because --failOn matches whole licence
      # names, not substrings: 'GPL' does not match 'GPL-3.0-only'. A shortened
      # 'AGPL;GPL;UNKNOWN' list looks right, passes a careless test, and in fact
      # catches nothing but packages with no licence field at all.
      #
      # Measured against a fixture whose root package declares a licence (a root
      # without one reads as UNKNOWN and fails everything, which is what made
      # the short list look like it worked):
      #
      #   MIT 0 | LGPL-3.0-only 0 | GPL-3.0-only 1 | AGPL-3.0-only 1 | none 1
      #
      # LGPL passing is deliberate. The one LGPL package is eslint-plugin-sonarjs,
      # a linter never linked into anything shipped.
      - name: Check the full tree for copyleft and unlicensed packages
        run: |
          npx license-checker-rseidelsohn --failOn \
            'AGPL-1.0;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GPL-1.0;GPL-1.0-only;GPL-1.0-or-later;GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;UNKNOWN'

      - name: Upload license report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: license-report
          path: licenses.json
          retention-days: 90

  # Reports action pins whose tag has moved since they were pinned.
  #
  # Pinning to a SHA closed a supply-chain hole and opened a maintenance job in
  # exchange: a pinned SHA is immune to a hijacked tag and equally immune to the
  # fixes that tag would have carried. Dependabot used to own refreshing them and
  # is banned under the no-scheduled-Actions policy, so this is the mechanism.
  #
  # workflow_dispatch only, deliberately. It reports on the state of the world
  # rather than on a change, so gating a PR with it would fail builds that
  # introduced nothing — the drift arrives when upstream moves a tag. Run it when
  # someone is ready to read release notes and act.
  #
  # Plain node, no npm ci and no NPM_TOKEN: the script uses only node builtins.
  action-pins:
    name: Action Pin Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check action pin freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-action-pins.js
