name: PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  validate-workflows:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow syntax
        run: |
          echo "Validating GitHub Actions workflow files..."
          errors=0

          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo "Checking $f..."

            # Basic YAML syntax check
            if ! python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "ERROR: Invalid YAML in $f"
              errors=$((errors + 1))
            fi

            # Check for required 'on' and 'jobs' keys
            if ! grep -q '^on:' "$f" && ! grep -q "^'on':" "$f" && ! grep -q '^"on":' "$f"; then
              echo "WARNING: Missing 'on' trigger in $f"
            fi

            if ! grep -q '^jobs:' "$f"; then
              echo "WARNING: Missing 'jobs' section in $f"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "Found $errors workflow file(s) with errors"
            exit 1
          fi

          echo "All workflow files are valid"

      # The checks above only cover YAML syntax and the presence of top-level
      # keys, so they cannot catch a misspelled action input — which is how
      # `file:` instead of `files:` silently disabled the Codecov upload for
      # months (#71). actionlint validates action inputs, expression syntax,
      # and (via its bundled shellcheck) the inline `run:` scripts.
      #
      # Pinned rather than tracking latest: this gates the build, so the
      # version is the one whose output was verified against these workflows.
      # Bumping it is a deliberate change, not a silent one.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail

          # On CI always fetch the pinned build so the gate is reproducible.
          # Off CI, reuse whatever is already installed: this step must never
          # overwrite a developer's own binary, which is what hardcoding
          # linux_amd64 into /usr/local/bin used to do when the workflow was
          # reproduced locally on macOS.
          # Probe by running it, not with `command -v`: that only checks for an
          # executable bit, so a binary for the wrong architecture — the exact
          # mess this step used to create — would be "reused" and then fail in
          # the next step. Failing the probe falls through to the download and
          # self-heals.
          # No pipe in the condition: under `pipefail` a SIGPIPE from the tool
          # writing into a closed `head` would make a working binary look
          # broken. `--version` prints three lines; keep only the first.
          if [ -z "${GITHUB_ACTIONS:-}" ] && installed=$(actionlint --version 2>/dev/null); then
            echo "Not on CI; reusing installed actionlint ${installed%%$'\n'*} (CI pins ${ACTIONLINT_VERSION})"
            exit 0
          fi

          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          bindir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ci-tools"
          mkdir -p "$bindir"
          # -f so an HTTP error fails here instead of piping an error page to tar.
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_${os}_${arch}.tar.gz" \
            | tar -xz -C "$bindir" actionlint
          "$bindir/actionlint" --version

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$bindir" >> "$GITHUB_PATH"
          else
            echo "Installed to $bindir; add it to PATH to run actionlint."
          fi

      - name: Run actionlint
        run: actionlint -color

  ci-check:
    name: CI Readiness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "type=python" >> "$GITHUB_OUTPUT"
          else
            echo "type=other" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        if: steps.detect.outputs.type == 'node'
        run: npm ci --ignore-scripts
        continue-on-error: true

      - name: Run lint check
        if: steps.detect.outputs.type == 'node'
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        if: steps.detect.outputs.type == 'node'
        run: npm test --if-present
        continue-on-error: true
